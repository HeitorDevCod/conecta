<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Conecta{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#07080a;font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif;color:#e9ecf1;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#07080a;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
            <tr>
              <td style="padding:0 0 20px 4px;font-size:24px;font-weight:800;letter-spacing:-1px;color:#e9ecf1;">
                <span style="display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:7px;background:#ffa53a;color:#07080a;font-size:18px;vertical-align:middle;">✦</span>
                <span style="vertical-align:middle;">&nbsp;conecta</span>
              </td>
            </tr>
            <tr>
              <td style="background:#0e1013;border:1px solid #1f232a;border-top:3px solid {% block accent %}#5cc8ff{% endblock %};border-radius:12px;padding:32px 28px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 8px 0;font-size:12px;line-height:18px;color:#565d69;">
                Você recebeu esta mensagem porque este endereço foi usado no Conecta.
                Se não foi você, pode ignorar este e-mail com segurança.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
