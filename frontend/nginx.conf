map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API REST e admin do Django
  location ~ ^/(api|admin|static)/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket (chat + sinalização WebRTC)
  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # SPA: qualquer outra rota cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # câmera, microfone e tela só para a própria origem
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
